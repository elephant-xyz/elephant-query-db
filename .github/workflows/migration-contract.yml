name: Migration contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: querydb
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d querydb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/querydb
      PRIVATE_BBB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/querydb_bbb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres querydb_bbb_test
      - run: npm run format:check:migration-contract
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
